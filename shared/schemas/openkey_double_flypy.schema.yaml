# OpenKey 双拼方案：小鹤双拼
# 键位为小鹤双拼公开发布的标准键位（事实映射）；algebra 表达由 OpenKey 自行编写，CC0-1.0。
# 与全拼主方案共用 openkey_base 词库，经 translator.prism 为每个方案构建独立拼写索引
# （多方案共用词库时必须指定不同 prism 名，参考 rime-ice 双拼方案写法）。
# encoding: utf-8

schema:
  schema_id: openkey_double_flypy
  name: 小鹤双拼
  version: "0.1.0"
  author:
    - OpenKey Developers
  description: |
    开门拼音 - 小鹤双拼。键位：zh=V、ch=I、sh=U；
    韵母键：Q=iu W=ia/ua E=e R=uan T=ue/ve Y=un O=o/uo P=ie S=ong/iong
    K=ing/uai D=ai F=en G=eng L=iang/uang H=ang M=ian J=an Z=ou X=ia/ua
    N=iao C=ao V=ui B=in；零声母：单字母韵母重复（啊=aa），
    双字母韵母首字母加韵母键（爱=ad、安=aj）。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, ABC ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。, ． ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    # j/q/x/y 后的 u 按 ü 处理，写作 v
    - derive/^([jqxy])u$/$1v/
    # 零声母：双字母韵母重复首字母（ai→aai、an→aan、ou→oou、ei→eei）
    - derive/^([aoe])([ioun])$/$1$1$2/
    # 零声母：单字母韵母与 ang/eng 重复首字母（a→aa、o→oo、e→ee、ang→aang、eng→eeng）
    - xform/^([aoe])(ng)?$/$1$1$2/
    # 韵母映射（小鹤标准键位）
    - xform/iu$/q/
    - xform/(.)ei$/$1w/
    - xform/uan$/r/
    - xform/[uv]e$/t/
    - xform/un$/y/
    # 声母映射（zh/ch/sh）
    - xform/^sh/u/
    - xform/^ch/i/
    - xform/^zh/v/
    # 其余韵母
    - xform/uo$/o/
    - xform/ie$/p/
    - xform/(.)i?ong$/$1s/
    - xform/ing$|uai$/k/
    - xform/(.)ai$/$1d/
    - xform/(.)en$/$1f/
    - xform/(.)eng$/$1g/
    - xform/[iu]ang$/l/
    - xform/(.)ang$/$1h/
    - xform/ian$/m/
    - xform/(.)an$/$1j/
    - xform/(.)ou$/$1z/
    - xform/[iu]a$/x/
    - xform/iao$/n/
    - xform/(.)ao$/$1c/
    - xform/ui$/v/
    - xform/in$/b/

translator:
  dictionary: openkey_base
  prism: openkey_base_flypy

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default

ascii_composer:
  import_preset: default
